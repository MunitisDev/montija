<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page paint under notches; the CSS then uses
      env(safe-area-inset-*) to keep the HUD out of them.
      user-scalable=no stops the browser pinch-zooming the page, because pinch
      belongs to the game camera.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
      Installed to a home screen, the game launches with no browser chrome at
      all — which is the only way a page can genuinely *start* full screen.
      A page may not enter fullscreen on load; the API requires a gesture, so
      in a browser tab there is a button instead.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12140f" />
    <meta
      name="description"
      content="Build a medieval settlement in an unforgiving wilderness and help it survive the winter."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Montija" />
    <title>Montija</title>
  </head>
  <body class="is-loading">
    <div id="game">
      <!-- The Phaser canvas is injected here. World objects live only inside it. -->
      <div id="game-canvas" aria-label="Settlement view" role="img"></div>

      <!--
        Resource icons, defined once and referenced twice.

        The strip shows a handful; the drawer shows all nine. Without a sprite
        that is every glyph written out twice in this file, which is two places
        to change a hammer and one of them to forget.
      -->
      <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <symbol id="icon-population" viewBox="0 0 24 24">
          <circle cx="12" cy="7" r="4" />
          <path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8z" />
        </symbol>
        <symbol id="icon-food" viewBox="0 0 24 24">
          <path d="M6 10a6 6 0 0 1 12 0z" />
          <path d="M2.5 11h19l-2 8a2 2 0 0 1-2 1.6H6.5a2 2 0 0 1-2-1.6z" />
        </symbol>
        <symbol id="icon-logs" viewBox="0 0 24 24">
          <rect x="6" y="3.4" width="14" height="7.2" rx="3.6" opacity=".62" />
          <ellipse cx="9.5" cy="7" rx="2.2" ry="3.6" fill="#12140f" opacity=".45" />
          <rect x="3" y="12.4" width="18" height="8.2" rx="4.1" />
          <ellipse cx="7.1" cy="16.5" rx="2.7" ry="4.1" fill="#12140f" opacity=".55" />
          <ellipse cx="7.1" cy="16.5" rx="1" ry="1.6" fill="currentColor" />
        </symbol>
        <symbol id="icon-firewood" viewBox="0 0 24 24">
          <path d="M5.1 3.6 8 2.2l11 16.6-2.9 1.4z" />
          <path d="M18.9 3.6 16 2.2 5 18.8l2.9 1.4z" />
          <rect x="9.6" y="9.6" width="4.8" height="4.8" rx="1.2" fill="#12140f" opacity=".5" />
        </symbol>
        <symbol id="icon-stone" viewBox="0 0 24 24">
          <path d="M12 2.6 21.4 9l-3.6 11.4H6.2L2.6 9z" />
          <path d="M12 2.6 21.4 9l-9.4 3z" fill="#12140f" opacity=".35" />
        </symbol>
        <!-- An ingot, seen end-on: a trapezoid with a lit top face. -->
        <symbol id="icon-iron" viewBox="0 0 24 24">
          <path d="M5 20h14l-2.4-7H7.4z" />
          <path d="M7.4 13h9.2l-1.1-3H8.5z" opacity=".7" />
          <path d="M8.5 10h7l-.8-2.4H9.3z" opacity=".45" />
        </symbol>
        <!-- A hammer, crossed with nothing: one clear silhouette at 16px. -->
        <symbol id="icon-tools" viewBox="0 0 24 24">
          <path d="M9.8 6.2 3.4 18.4l2.6 1.5 6.4-12.2z" />
          <path d="M11.2 2.6 20 6.6l-1.8 4.2-8.8-4z" />
        </symbol>
        <!-- A stretched pelt: four legs and a rounded body. -->
        <symbol id="icon-hides" viewBox="0 0 24 24">
          <path
            d="M12 3.4c2 0 3 1.2 4.6 1.2 1.6 0 2.6-1 3.4-.2.8.8-.6 2.2-1 3.4-.4 1.2.4 2.6 0 3.8-.5 1.5-2 1.6-2.4 3-.4 1.4.8 3 0 3.8-.9.9-2.2-.6-3.4-.6h-2.4c-1.2 0-2.5 1.5-3.4.6-.8-.8.4-2.4 0-3.8-.4-1.4-1.9-1.5-2.4-3-.4-1.2.4-2.6 0-3.8-.4-1.2-1.8-2.6-1-3.4.8-.8 1.8.2 3.4.2C9 4.6 10 3.4 12 3.4z"
          />
        </symbol>
        <!-- A coat: shoulders, sleeves and a hem. -->
        <symbol id="icon-clothing" viewBox="0 0 24 24">
          <path d="M9 3h6l5 3.4-2.2 3.8L16 9v12H8V9l-1.8 1.2L4 6.4z" />
          <path d="M12 3v18" opacity=".35" stroke="#12140f" stroke-width="1.2" />
        </symbol>
        <!-- A sprig: a stem with three pairs of leaves. -->
        <symbol id="icon-herbs" viewBox="0 0 24 24">
          <path d="M11.4 21V8h1.2v13z" />
          <path d="M12 12.6c-3 0-5-1.4-5.6-4 2.8-.6 4.8.6 5.6 4z" />
          <path d="M12 12.6c3 0 5-1.4 5.6-4-2.8-.6-4.8.6-5.6 4z" />
          <path d="M12 7.6c-2.2 0-3.8-1.2-4.2-3.4 2.2-.4 3.6.6 4.2 3.4z" />
          <path d="M12 7.6c2.2 0 3.8-1.2 4.2-3.4-2.2-.4-3.6.6-4.2 3.4z" />
        </symbol>

        <!--
          Four faces, for the cards under a building's panel.

          Age reads at a glance where a number does not, so a child and an elder
          are their own silhouettes rather than a smaller and a greyer adult.
          Drawn as shoulders and a head, the way a portrait is framed — no
          features: at 34 pixels a face is two dots and a smudge, and these are
          placeholders standing in for artwork that is not made yet.
        -->
        <symbol id="portrait-man" viewBox="0 0 24 24">
          <circle cx="12" cy="7.6" r="4.6" />
          <!-- Broad, square shoulders, running off the bottom of the disc. -->
          <path d="M2 24c0-5 4.5-8.4 10-8.4S22 19 22 24z" />
        </symbol>
        <symbol id="portrait-woman" viewBox="0 0 24 24">
          <!-- Long hair, drawn first so the head sits inside it: it frames the
               face and falls past the shoulders, which is what tells this
               silhouette from the hooded one at sixteen pixels. -->
          <path
            d="M5.2 22.4c-1.1-3.4-1.4-6.4-.9-9C5.1 9 8 6 12 6s6.9 3 7.7 7.4c.5 2.6.2 5.6-.9 9l-2.9-.7c.9-2.9 1.2-5.3.8-7.3-.5-2.9-2.3-4.6-4.7-4.6s-4.2 1.7-4.7 4.6c-.4 2-.1 4.4.8 7.3z"
          />
          <circle cx="12" cy="10" r="4" />
          <path d="M4.6 24c0-4.3 3.5-7.2 7.4-7.2s7.4 2.9 7.4 7.2z" />
        </symbol>
        <symbol id="portrait-child" viewBox="0 0 24 24">
          <!-- A bigger head on smaller shoulders: the whole trick of drawing a
               child at this size. -->
          <circle cx="12" cy="8.8" r="5.6" />
          <path d="M5.6 24c0-4 2.8-6.6 6.4-6.6s6.4 2.6 6.4 6.6z" />
        </symbol>
        <symbol id="portrait-elder" viewBox="0 0 24 24">
          <!-- Stooped, and leaning forward: the head sits low and off centre
               over a rounded back. Age reads as posture at this size; a lined
               face does not read at all. -->
          <circle cx="13.4" cy="11" r="3.8" />
          <path
            d="M3.4 24c0-4.4 1.2-7.6 3.4-8.8 1.2-.7 2-.2 3.4-.6 1-.3 1.6-.9 2.8-.9 4 0 7.2 3.6 7.2 10.3z"
          />
        </symbol>
      </svg>

      <!-- HUD overlay: HTML/CSS, deliberately outside the canvas. -->
      <div id="hud">
        <div class="hud-bar hud-bar--top">
          <!--
            Two named rows rather than a wrapping list.
            
            Landscape flattens them back into one line with `display: contents`,
            so this costs nothing where the width is there. Held upright the
            wrap used to fall wherever the widths happened to land — the roster
            button on one line in Spanish and the next in English, the calendar
            stranded on a third row of its own. Saying where the break goes is
            the only way the phone layout stays the same layout.
          -->
          <div class="hud-row hud-row--stocks">
            <!--
            The strip is a button, and the whole list is behind it.

            Nine resources across a phone held upright is two lines of world
            given up to numbers a player checks occasionally. Four essentials
            and a tap for the rest keeps the bar one line however many goods
            the settlement learns to make.
          -->
            <button
              type="button"
              class="resource-strip"
              data-ui="stock-toggle"
              aria-expanded="false"
              aria-controls="stock-drawer"
            >
              <span class="resource resource--population">
                <svg class="resource__icon"><use href="#icon-population" /></svg>
                <span class="resource__label" data-i18n="hud.population">population</span>
                <span class="resource__value" data-hud="population">--</span>
              </span>
              <span class="resource resource--food">
                <svg class="resource__icon"><use href="#icon-food" /></svg>
                <span class="resource__label" data-i18n="hud.food">food</span>
                <span class="resource__value" data-hud="food">--</span>
              </span>
              <span class="resource resource--logs">
                <svg class="resource__icon"><use href="#icon-logs" /></svg>
                <span class="resource__label" data-i18n="hud.logs">logs</span>
                <span class="resource__value" data-hud="logs">--</span>
              </span>
              <span class="resource resource--firewood">
                <svg class="resource__icon"><use href="#icon-firewood" /></svg>
                <span class="resource__label" data-i18n="hud.firewood">firewood</span>
                <span class="resource__value" data-hud="firewood">--</span>
              </span>
              <span class="resource resource--stone">
                <svg class="resource__icon"><use href="#icon-stone" /></svg>
                <span class="resource__label" data-i18n="hud.stone">stone</span>
                <span class="resource__value" data-hud="stone">--</span>
              </span>
              <svg
                class="resource-strip__chevron"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M5.6 9.2 12 15.4l6.4-6.2z" />
              </svg>
            </button>

            <!-- The settlement's people. Next to the rules because both are
               "open, read, act, close" rather than part of the world. -->
            <button type="button" class="icon-button" data-ui="roster-open" aria-label="People">
              <svg
                class="icon-button__glyph"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="9" cy="7" r="3.4" />
                <path d="M2 21c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4z" />
                <circle cx="17.5" cy="8.5" r="2.6" />
                <path d="M14.6 14.4c.9-.4 1.9-.6 2.9-.6 3 0 4.5 2 4.5 4.6h-5.2c0-1.6-.8-3-2.2-4z" />
              </svg>
            </button>
          </div>

          <div class="hud-row hud-row--tools">
            <!-- Who works where. Beside the people button because the two
               answer halves of the same question: that one is by household,
               this one is by workplace. -->
            <button type="button" class="icon-button" data-ui="labour-open" aria-label="Work">
              <svg
                class="icon-button__glyph"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <!-- A hammer: head across the top left, handle down to the right. -->
                <path d="M3.1 7.4 7.4 3.1l4.9 4.9-4.3 4.3z" />
                <path d="m9.4 12.5 2.1-2.1 8.6 8.6a1.5 1.5 0 0 1-2.1 2.1z" opacity=".55" />
              </svg>
            </button>

            <!-- One button for the clock, cycling pause, 1x, 2x, 4x. Four
               buttons for four speeds cost a corner of the bottom bar to say
               something one button says in two characters. -->
            <button
              type="button"
              class="icon-button icon-button--text"
              data-ui="speed-cycle"
              aria-label="Speed"
            >
              <span class="icon-button__text" data-hud="speed-label">1x</span>
            </button>

            <!-- The ledger: what the settlement has, makes, spends and is. -->
            <button type="button" class="icon-button" data-ui="ledger-open" aria-label="Ledger">
              <svg
                class="icon-button__glyph"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M4.4 3.2h13.2a2 2 0 0 1 2 2v15.6H6.4a2 2 0 0 1-2-2z" opacity=".55" />
                <path d="M4.4 3.2h2.6v17.6H6.4a2 2 0 0 1-2-2z" />
                <rect x="9.2" y="7" width="7.6" height="1.5" rx=".7" />
                <rect x="9.2" y="11" width="7.6" height="1.5" rx=".7" />
                <rect x="9.2" y="15" width="4.8" height="1.5" rx=".7" />
              </svg>
            </button>

            <!-- Everything that is not the settlement itself lives behind this:
               the rules, saving, full screen, language. The top bar of a phone
               held upright has room for the numbers and very little else. -->
            <button type="button" class="icon-button" data-ui="settings-open" aria-label="Settings">
              <svg
                class="icon-button__glyph"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <!-- A ring with a hole punched by the even-odd rule, and eight
                   teeth laid out as one quartet rotated twice. -->
                <path
                  fill-rule="evenodd"
                  d="M12 5.4a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2zm0 2.4a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4z"
                />
                <rect x="10.6" y="1.6" width="2.8" height="4.2" rx="0.7" />
                <rect x="10.6" y="18.2" width="2.8" height="4.2" rx="0.7" />
                <rect x="1.6" y="10.6" width="4.2" height="2.8" rx="0.7" />
                <rect x="18.2" y="10.6" width="4.2" height="2.8" rx="0.7" />
                <g transform="rotate(45 12 12)">
                  <rect x="10.6" y="1.6" width="2.8" height="4.2" rx="0.7" />
                  <rect x="10.6" y="18.2" width="2.8" height="4.2" rx="0.7" />
                  <rect x="1.6" y="10.6" width="4.2" height="2.8" rx="0.7" />
                  <rect x="18.2" y="10.6" width="4.2" height="2.8" rx="0.7" />
                </g>
              </svg>
            </button>

            <div class="climate-strip">
              <span class="climate__season" data-hud="season"></span>
              <!-- The day of the season, split off so a narrow phone can drop
                   it and keep the season itself. -->
              <span class="climate__day" data-hud="day"></span>
              <span class="climate__temperature" data-hud="temperature">--</span>
            </div>
          </div>
        </div>

        <!-- Opens under the strip rather than over the world: a glance at the
             stores is not something the player stops the game for. -->
        <div class="stock-drawer" id="stock-drawer" data-ui="stock-drawer" hidden>
          <ul class="stock-list">
            <li class="stock" data-stock="vegetables">
              <svg class="stock__icon"><use href="#icon-food" /></svg>
              <span class="stock__name" data-i18n="hud.vegetables">vegetables</span>
              <span class="stock__value" data-drawer="vegetables">0</span>
              <span class="stock__note" data-drawer-note="vegetables"></span>
            </li>
            <li class="stock" data-stock="fruit">
              <svg class="stock__icon"><use href="#icon-food" /></svg>
              <span class="stock__name" data-i18n="hud.fruit">fruit</span>
              <span class="stock__value" data-drawer="fruit">0</span>
              <span class="stock__note" data-drawer-note="fruit"></span>
            </li>
            <li class="stock" data-stock="fish">
              <svg class="stock__icon"><use href="#icon-food" /></svg>
              <span class="stock__name" data-i18n="hud.fish">fish</span>
              <span class="stock__value" data-drawer="fish">0</span>
              <span class="stock__note" data-drawer-note="fish"></span>
            </li>
            <li class="stock" data-stock="meat">
              <svg class="stock__icon"><use href="#icon-food" /></svg>
              <span class="stock__name" data-i18n="hud.meat">meat</span>
              <span class="stock__value" data-drawer="meat">0</span>
              <span class="stock__note" data-drawer-note="meat"></span>
            </li>
            <li class="stock" data-stock="spices">
              <svg class="stock__icon"><use href="#icon-food" /></svg>
              <span class="stock__name" data-i18n="hud.spices">spices</span>
              <span class="stock__value" data-drawer="spices">0</span>
              <span class="stock__note" data-drawer-note="spices"></span>
            </li>
            <li class="stock" data-stock="logs">
              <svg class="stock__icon"><use href="#icon-logs" /></svg>
              <span class="stock__name" data-i18n="hud.logs">logs</span>
              <span class="stock__value" data-drawer="logs">0</span>
              <span class="stock__note" data-drawer-note="logs"></span>
            </li>
            <li class="stock" data-stock="firewood">
              <svg class="stock__icon"><use href="#icon-firewood" /></svg>
              <span class="stock__name" data-i18n="hud.firewood">firewood</span>
              <span class="stock__value" data-drawer="firewood">0</span>
              <span class="stock__note" data-drawer-note="firewood"></span>
            </li>
            <li class="stock" data-stock="stone">
              <svg class="stock__icon"><use href="#icon-stone" /></svg>
              <span class="stock__name" data-i18n="hud.stone">stone</span>
              <span class="stock__value" data-drawer="stone">0</span>
              <span class="stock__note" data-drawer-note="stone"></span>
            </li>
            <li class="stock" data-stock="iron">
              <svg class="stock__icon"><use href="#icon-iron" /></svg>
              <span class="stock__name" data-i18n="hud.iron">iron</span>
              <span class="stock__value" data-drawer="iron">0</span>
              <span class="stock__note" data-drawer-note="iron"></span>
            </li>
            <li class="stock" data-stock="tools">
              <svg class="stock__icon"><use href="#icon-tools" /></svg>
              <span class="stock__name" data-i18n="hud.tools">tools</span>
              <span class="stock__value" data-drawer="tools">0</span>
              <span class="stock__note" data-drawer-note="tools"></span>
            </li>
            <li class="stock" data-stock="hides">
              <svg class="stock__icon"><use href="#icon-hides" /></svg>
              <span class="stock__name" data-i18n="hud.hides">hides</span>
              <span class="stock__value" data-drawer="hides">0</span>
              <span class="stock__note" data-drawer-note="hides"></span>
            </li>
            <li class="stock" data-stock="clothing">
              <svg class="stock__icon"><use href="#icon-clothing" /></svg>
              <span class="stock__name" data-i18n="hud.clothing">clothing</span>
              <span class="stock__value" data-drawer="clothing">0</span>
              <span class="stock__note" data-drawer-note="clothing"></span>
            </li>
            <li class="stock" data-stock="herbs">
              <svg class="stock__icon"><use href="#icon-herbs" /></svg>
              <span class="stock__name" data-i18n="hud.herbs">herbs</span>
              <span class="stock__value" data-drawer="herbs">0</span>
              <span class="stock__note" data-drawer-note="herbs"></span>
            </li>
          </ul>
          <p class="stock-drawer__foot" data-ui="stock-foot"></p>
        </div>

        <!--
          Shown when the last villager is gone.

          A closing page rather than a notice: the totals, what took each of
          them, and the roll of everyone who ever lived here. The roll scrolls
          on its own so the title and the button stay put on a phone.
        -->
        <div class="failure" data-hud="failure" role="alertdialog" hidden>
          <h2 class="failure__title" data-i18n="failure.title"></h2>
          <p class="failure__body" data-i18n="failure.body"></p>
          <p class="failure__stat" data-hud="failure-survived"></p>
          <div class="failure__sheet">
            <section class="failure__block">
              <h3 class="failure__heading" data-i18n="end.stats"></h3>
              <dl class="failure__figures" data-hud="failure-stats"></dl>
            </section>
            <section class="failure__block">
              <h3 class="failure__heading" data-i18n="end.causes"></h3>
              <dl class="failure__figures" data-hud="failure-causes"></dl>
            </section>
            <section class="failure__block failure__block--roll">
              <h3 class="failure__heading" data-hud="failure-roll-title"></h3>
              <ol class="failure__roll" data-hud="failure-roll"></ol>
              <p class="failure__note" data-hud="failure-ill"></p>
            </section>
          </div>
          <button type="button" class="failure__restart" data-hud="failure-restart"></button>
        </div>

        <!-- Advice when the settlement is heading for trouble. Under the top
             bar, not across the middle of the settlement. -->
        <div class="advice" data-hud="advice" role="status" hidden></div>

        <!-- Transient notices: births, arrivals, deaths. Below the advice so
             one arriving does not shove the standing warning down the screen. -->
        <div class="events" data-hud="events" role="status" aria-live="polite"></div>

        <div class="hud-bar hud-bar--bottom">
          <div class="bottom-left">
            <!-- Contextual panel: shows whatever the player last tapped. -->
            <div class="tile-panel" data-hud="selection" hidden>
              <span class="tile-panel__terrain" data-hud="selection-terrain"></span>
              <span class="tile-panel__cell" data-hud="selection-cell"></span>
              <span class="tile-panel__flags" data-hud="selection-flags"></span>
              <button
                type="button"
                class="tile-panel__action"
                data-hud="selection-action"
                hidden
              ></button>
              <button
                type="button"
                class="tile-panel__action tile-panel__action--road"
                data-hud="selection-road"
                hidden
              ></button>
              <button
                type="button"
                class="tile-panel__action tile-panel__action--ditch"
                data-hud="selection-ditch"
                hidden
              ></button>
              <button
                type="button"
                class="tile-panel__action tile-panel__action--fence"
                data-hud="selection-fence"
                hidden
              ></button>
              <button
                type="button"
                class="tile-panel__action tile-panel__action--bridge"
                data-hud="selection-bridge"
                hidden
              ></button>
            </div>

            <!-- What the player last tapped, when it was a building. -->
            <div class="building-panel" data-hud="building" hidden>
              <span class="building-panel__name" data-hud="building-name"></span>
              <span class="building-panel__state" data-hud="building-state"></span>
              <span class="building-panel__detail" data-hud="building-detail"></span>
              <!-- The worker quota: the one lever employment gives the player. -->
              <span class="worker-control" data-hud="worker-control" hidden>
                <span class="worker-control__label" data-hud="worker-label"></span>
                <button type="button" data-hud="worker-fewer" aria-label="Fewer workers">–</button>
                <span class="worker-control__count" data-hud="worker-count"></span>
                <button type="button" data-hud="worker-more" aria-label="More workers">+</button>
              </span>
              <!-- Only on a trading post: what the merchant should swap. -->
              <span class="trade-control" data-hud="trade-control" hidden>
                <button type="button" data-hud="trade-sell"></button>
                <span class="trade-control__arrow" aria-hidden="true">→</span>
                <button type="button" data-hud="trade-buy"></button>
              </span>
              <!-- The one improvement a building can be given, where it can. -->
              <button
                type="button"
                class="building-panel__improve"
                data-hud="improve"
                hidden
              ></button>
              <button
                type="button"
                class="building-panel__demolish"
                data-hud="demolish"
                hidden
              ></button>
              <!--
                Who is in there: a card each, on a line of their own.

                "Workers 2/2" answers how many and nothing else — not who, not
                that one of them is the settlement's only master forager. Under a
                house the same cards are the family that sleeps there.
              -->
              <div class="cards" data-hud="building-cards" hidden></div>
              <!--
                Who lies in the ground, on a cemetery's panel only.

                A death used to leave nothing behind but a number in the
                chronicle. The end screen read the roll out afterwards, which is
                too late to be any use to anybody.
              -->
              <div class="buried" data-hud="building-buried" hidden>
                <span class="buried__title" data-hud="buried-title"></span>
                <ul class="buried__roll" data-hud="buried-roll"></ul>
                <span class="buried__more" data-hud="buried-more"></span>
              </div>
            </div>

            <!-- Build menu. Buttons are generated from data/buildings.ts. -->
            <!--
              The build menu, in two parts.

              The bar carries five category buttons, not seventeen buildings:
              a horizontal scroller meant swiping sideways to find a House, and
              the list only gets longer. The panel above it holds the buildings
              of whichever category is open, as a wrapping grid that never
              scrolls sideways.
            -->
            <div class="build-panel" data-hud="build-panel" hidden></div>
            <div class="build-bar" data-hud="build-bar" role="group" aria-label="Build menu"></div>

            <!--
              Road-drawing controls, shown only while a run is being aimed.

              The placement bar's own class, because it is the same kind of
              thing in the same place: something is being aimed, and there is a
              button to commit it and a button to drop it.
            -->
            <div class="placement-bar" data-hud="roadline" hidden>
              <span class="placement-bar__label" data-hud="roadline-label"></span>
              <span class="placement-bar__hint" data-hud="roadline-hint"></span>
              <button
                type="button"
                class="placement-bar__confirm"
                data-hud="roadline-confirm"
              ></button>
              <button
                type="button"
                class="placement-bar__cancel"
                data-hud="roadline-cancel"
              ></button>
            </div>

            <!-- Placement controls, shown only while positioning a building. -->
            <div class="placement-bar" data-hud="placement" hidden>
              <span class="placement-bar__label" data-hud="placement-label"></span>
              <span class="placement-bar__hint" data-hud="placement-hint"></span>
              <button
                type="button"
                class="placement-bar__confirm"
                data-hud="placement-confirm"
              ></button>
              <button
                type="button"
                class="placement-bar__cancel"
                data-hud="placement-cancel"
              ></button>
            </div>
          </div>
        </div>
      </div>

      <!--
        Start screen and instructions.

        Siblings of #hud rather than children of it: that layer is transparent
        to pointers so world gestures reach the canvas, and these two must
        swallow every gesture they are given.
      -->
      <div class="menu" data-ui="menu" role="dialog" aria-modal="true" aria-label="Montija" hidden>
        <div class="menu__panel">
          <h1 class="menu__title">Montija</h1>
          <p class="menu__tagline" data-ui="menu-tagline"></p>
          <div class="menu__actions" data-ui="menu-actions">
            <button
              type="button"
              class="menu__button menu__button--primary"
              data-ui="menu-continue"
            ></button>
            <button type="button" class="menu__button" data-ui="menu-new"></button>
            <button type="button" class="menu__button" data-ui="menu-guide"></button>
          </div>

          <!--
            Every settlement in the store but the newest, which is the button
            above. Built by the menu rather than written here: how many there
            are is a question about the player's history.
          -->
          <div class="menu__saves" data-ui="menu-saves"></div>

          <!--
            Naming a new settlement. A form so the on-screen keyboard offers a
            Go key and Enter founds the village — the one place in this game
            where a keyboard is the right instrument.
          -->
          <form class="menu__name" data-ui="menu-name" hidden>
            <label class="menu__label" for="settlement-name" data-ui="menu-name-label"></label>
            <input
              class="menu__input"
              id="settlement-name"
              data-ui="menu-name-input"
              type="text"
              maxlength="24"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              type="submit"
              class="menu__button menu__button--primary"
              data-ui="menu-found"
            ></button>
            <p class="menu__rule" data-ui="menu-permadeath"></p>
          </form>

          <p class="menu__note" data-ui="menu-note"></p>
          <button
            type="button"
            class="menu__language"
            data-ui="menu-language"
            aria-label="Language"
          ></button>
          <!-- Which build this is. Small, dim, and the last thing on the card. -->
          <p class="menu__version" data-ui="menu-version"></p>
        </div>
      </div>

      <!--
        The ledger: aggregate figures, in five tabs.

        Deliberately not the people panel. That one is a list of individuals;
        this is the settlement counted — how many, of what, making what,
        spending what. A player asking "are we going to make it through winter"
        is asking this sheet, not that one.
      -->
      <div class="sheet" data-ui="ledger" role="dialog" aria-modal="true" hidden>
        <div class="sheet__panel">
          <header class="sheet__head">
            <h2 class="sheet__title" data-ui="ledger-title"></h2>
            <button type="button" class="sheet__close" data-ui="ledger-close"></button>
          </header>
          <div class="ledger__tabs" role="tablist" data-ui="ledger-tabs"></div>
          <div class="sheet__body" data-ui="ledger-body" role="tabpanel"></div>
        </div>
      </div>

      <div class="sheet" data-ui="settings" role="dialog" aria-modal="true" hidden>
        <div class="sheet__panel sheet__panel--narrow">
          <header class="sheet__head">
            <h2 class="sheet__title" data-ui="settings-title"></h2>
            <button type="button" class="sheet__close" data-ui="settings-close"></button>
          </header>
          <div class="sheet__body settings">
            <section class="settings__group">
              <h3 class="settings__heading" data-ui="settings-game"></h3>
              <div class="settings__row">
                <button type="button" class="settings__button" data-ui="settings-guide"></button>
              </div>
              <div class="settings__row">
                <button type="button" class="settings__button" data-hud="save"></button>
                <button type="button" class="settings__button" data-hud="load"></button>
              </div>
              <p class="settings__status" data-hud="save-status" role="status"></p>
            </section>

            <section class="settings__group">
              <div class="settings__row">
                <button
                  type="button"
                  class="settings__button settings__button--grave"
                  data-ui="settings-restart"
                ></button>
              </div>
              <p class="settings__status" data-ui="settings-restart-note"></p>
            </section>

            <section class="settings__group">
              <h3 class="settings__heading" data-ui="settings-display"></h3>
              <div class="settings__row">
                <button
                  type="button"
                  class="settings__button"
                  data-hud="fullscreen"
                  hidden
                ></button>
                <button type="button" class="settings__button" data-ui="settings-language"></button>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div class="sheet" data-ui="roster" role="dialog" aria-modal="true" hidden>
        <div class="sheet__panel">
          <header class="sheet__head">
            <h2 class="sheet__title" data-ui="roster-title"></h2>
            <button type="button" class="sheet__close" data-ui="roster-close"></button>
          </header>
          <div class="sheet__body roster" data-ui="roster-body"></div>
        </div>
      </div>

      <!--
        Work: every workplace at once, with a pair of buttons each.

        Its own door rather than a page of the ledger: the ledger reports and
        never acts, and controls scattered through a page of figures stop it
        being a page of figures.
      -->
      <div class="sheet" data-ui="labour" role="dialog" aria-modal="true" hidden>
        <div class="sheet__panel">
          <header class="sheet__head">
            <h2 class="sheet__title" data-ui="labour-title"></h2>
            <button type="button" class="sheet__close" data-ui="labour-close"></button>
          </header>
          <div class="sheet__body roster" data-ui="labour-body"></div>
        </div>
      </div>

      <div class="sheet" data-ui="guide" role="dialog" aria-modal="true" hidden>
        <div class="sheet__panel">
          <header class="sheet__head">
            <h2 class="sheet__title" data-ui="guide-title"></h2>
            <button type="button" class="sheet__close" data-ui="guide-close"></button>
          </header>
          <div class="sheet__body guide" data-ui="guide-body"></div>
        </div>
      </div>

      <!-- Development diagnostics. Hidden and tree-shaken out of production. -->
      <button id="debug-toggle" type="button" hidden>debug</button>
      <pre id="debug-overlay" hidden></pre>
    </div>

    <noscript>
      <p class="noscript">
        Montija needs JavaScript and WebGL to run.<br />Montija necesita JavaScript y WebGL para
        funcionar.
      </p>
    </noscript>

    <script type="module" src="/src/app/bootstrap.ts"></script>
  </body>
</html>
